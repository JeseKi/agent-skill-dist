[project]
name = "agent-skill-dist"
version = "0.1.1"
description = "从 Python CLI 包中安装内置 agent skill。"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.2.2",
    "mypy>=1.16.0",
    "pytest>=8.4.0",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_skill_dist"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/fixtures"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests/fixtures"]
